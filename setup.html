<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pokémon Assistant Setup</title><body style="font:16px system-ui;max-width:560px;margin:48px auto;padding:0 18px"><h2>Post the Pokémon Assistant menu</h2><p>Enter your setup secret from Vercel. It is sent directly to this site's protected setup endpoint; do not share it with anyone.</p><form id="f"><input id="s" type="password" required placeholder="Setup secret" style="box-sizing:border-box;width:100%;padding:12px;margin:8px 0"><button style="padding:12px 18px">Post menu to Discord</button></form><p id="result"></p><script>document.getElementById("f").addEventListener("submit",async e=>{e.preventDefault();const out=document.getElementById("result");out.textContent="Posting…";try{const r=await fetch("/api/setup",{method:"POST",headers:{Authorization:"Bearer "+document.getElementById("s").value}});const d=await r.json();out.textContent=r.ok?"Menu posted! Go to Discord and pin the new message.":("Error: "+(d.error||r.status));}catch{out.textContent="Request failed. Check deployment and try again."}});</script></body></html>
